version: '3.9'

services:
  # ---- Основное приложение ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/salesagent
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - salesagent-net

  # ---- PostgreSQL с pgvector ----
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salesagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - salesagent-net

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - salesagent-net

  # ---- MinIO (S3-совместимое хранилище) ----
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - salesagent-net

  # ---- React Admin (продакшн сборка) ----
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - app
    networks:
      - salesagent-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  salesagent-net:
    driver: bridge
