services:
  # ---- Основное приложение ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # The image entrypoint creates a percent-encoded DATABASE_URL from these
      # fields, so URI metacharacters in credentials remain safe.
      DATABASE_URL: ''
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-salesagent}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-salesagent-local-redis-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_RECORDINGS: ${S3_BUCKET_RECORDINGS:-recordings}
      S3_BUCKET_KNOWLEDGE: ${S3_BUCKET_KNOWLEDGE:-knowledge}
      S3_REGION: ${S3_REGION:-us-east-1}
      WHATSAPP_AUTH_DIR: /app/data/whatsapp-auth
    volumes:
      - whatsapp_auth:/app/data/whatsapp-auth
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
        restart: true
      redis:
        condition: service_healthy
        restart: true
      minio-init:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    networks:
      - salesagent-net

  # ---- PostgreSQL с pgvector ----
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-salesagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/healthcheck.sh:/usr/local/bin/postgres-healthcheck:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD', '/bin/sh', '/usr/local/bin/postgres-healthcheck']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - salesagent-net

  # Миграции выполняются при каждом compose up, включая existing volumes.
  # Скрипт принимает только 001_*.sql, 002_*.sql, ... и игнорирует _old_*.
  migrate:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-salesagent}
      MIGRATIONS_ADOPT_LEGACY_BASELINE: ${MIGRATIONS_ADOPT_LEGACY_BASELINE:-false}
    volumes:
      - ./migrations:/migrations:ro
      - ./docker/postgres/migrate.sh:/usr/local/bin/run-migrations:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/run-migrations']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - salesagent-net

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    command:
      - /bin/sh
      - -c
      - exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-salesagent-local-redis-change-me}
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - salesagent-net

  # ---- MinIO (S3-совместимое хранилище) ----
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - salesagent-net

  # Идемпотентно создаёт buckets до старта backend.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_RECORDINGS: ${S3_BUCKET_RECORDINGS:-recordings}
      S3_BUCKET_KNOWLEDGE: ${S3_BUCKET_KNOWLEDGE:-knowledge}
    volumes:
      - ./docker/minio/init.sh:/usr/local/bin/init-minio:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/init-minio']
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    networks:
      - salesagent-net

  # ---- React Admin (продакшн сборка) ----
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - salesagent-net

volumes:
  pgdata:
  redisdata:
  miniodata:
  whatsapp_auth:

networks:
  salesagent-net:
    driver: bridge
